name: CI

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

env:
  GO_VERSION: '1.25'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-v2-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ env.GO_VERSION }}-v2-
    
    - name: Download dependencies
      run: go mod download
    
    - name: Verify dependencies
      run: go mod verify
    
    - name: Run tests
      run: make test
    
    - name: Generate coverage report
      run: make coverage
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        # Pinned deliberately. With `latest`, the linter floats while the source
        # stands still, so a green master turns red on a commit that touches no Go
        # code: staticcheck enabled QF1012 in v2.12.2 and the next unrelated PR ate
        # the failure. Bump this on purpose, so the rule churn lands in a commit
        # that is about the rule churn.
        version: v2.12.2
        args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-v2-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ env.GO_VERSION }}-v2-
    
    - name: Download dependencies
      run: go mod download
    
    - name: Build binary
      run: make build
    
    - name: Test CLI functionality
      run: |
        ./build/usfmp --help
        ./build/usfmp --version || echo "Version flag not implemented yet"
    
    - name: Test with sample data
      run: |
        if [ -f "bsb_usfm/01GENBSB.SFM" ]; then
          ./build/usfmp -f json -q bsb_usfm/01GENBSB.SFM > /dev/null
          echo "✅ JSON output test passed"
          ./build/usfmp -f txt -q bsb_usfm/01GENBSB.SFM > /dev/null
          echo "✅ Text output test passed"
          ./build/usfmp -f tsv -q bsb_usfm/01GENBSB.SFM > /dev/null
          echo "✅ TSV output test passed"
        else
          echo "⚠️ Sample data not found, skipping integration tests"
        fi
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: usfmp-binary-${{ github.sha }}
        path: build/usfmp
        retention-days: 30


  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis
    
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Run go vet
      run: go vet ./...
    
    - name: Run go fmt check
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files need formatting:"
          gofmt -s -l .
          exit 1
        fi
    
    - name: Run ineffassign
      run: |
        go install github.com/gordonklaus/ineffassign@latest
        ineffassign ./...
    
    - name: Run misspell
      run: |
        go install github.com/client9/misspell/cmd/misspell@latest
        find . \( -name "bsb_usfm" -o -name "vendor" \) -prune -o -name "*.go" -type f -print -o -name "*.md" -type f -print -o -name "*.yml" -type f -print -o -name "*.yaml" -type f -print | xargs misspell -error
    

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, lint, build, code-quality]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: '~> v2'
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}